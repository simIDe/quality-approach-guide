# Documentation site: built on every pull request, published on every merge to main.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a running deployment is not cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the pages' last-updated date
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check every page is in the navigation, in both languages
        run: node scripts/check-navigation.mjs
      - name: Build the site in both languages (fails on a broken link or anchor)
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
