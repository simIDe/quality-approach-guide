# Dependencies of the example (the site itself is built with Node.js: see package.json).
[project]
name = "quality-approach-guide"
version = "0.1.0"
description = "Minimal data product example of the Quality Approach guide"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["examples/training-load/tests"]
pythonpath = ["examples/training-load"]
