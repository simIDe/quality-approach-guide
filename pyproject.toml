# Dépendances de l'exemple (le site, lui, est construit avec Node.js : voir package.json).
[project]
name = "quality-approach-guide"
version = "0.1.0"
description = "Exemple minimal de data product du guide Quality Approach"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["exemples/charge-entrainement/tests"]
pythonpath = ["exemples/charge-entrainement"]
